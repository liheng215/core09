<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="42" stroke="url(#logoGrad)" stroke-width="2" fill="none" opacity="0.3"/>
  <circle cx="50" cy="50" r="38" stroke="url(#logoGrad)" stroke-width="1" fill="none" opacity="0.2"/>
  
  <!-- Weight Scale Plate -->
  <ellipse cx="50" cy="35" rx="28" ry="8" fill="url(#logoGrad)" filter="url(#glow)"/>
  <ellipse cx="50" cy="35" rx="24" ry="6" fill="#030712"/>
  
  <!-- Scale Bar -->
  <rect x="47" y="43" width="6" height="35" fill="url(#logoGrad)" rx="2" filter="url(#glow)"/>
  
  <!-- Digital Display -->
  <rect x="35" y="58" width="30" height="18" fill="#0f172a" stroke="url(#logoGrad)" stroke-width="1.5" rx="2"/>
  
  <!-- Display Text -->
  <text x="50" y="71" text-anchor="middle" fill="#22d3ee" font-size="10" font-family="Orbitron, sans-serif" font-weight="bold" letter-spacing="1">
    85
  </text>
  <text x="78" y="71" text-anchor="middle" fill="#22d3ee" font-size="6" font-family="Orbitron, sans-serif" font-weight="bold">
    KG
  </text>
  
  <!-- Decorative Elements -->
  <circle cx="25" cy="25" r="2" fill="#22d3ee" opacity="0.6"/>
  <circle cx="75" cy="75" r="2" fill="#6366f1" opacity="0.6"/>
  <circle cx="75" cy="25" r="1.5" fill="#3b82f6" opacity="0.5"/>
  <circle cx="25" cy="75" r="1.5" fill="#22d3ee" opacity="0.5"/>
</svg>
